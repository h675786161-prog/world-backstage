name: Apply world clock authority refactor

on:
  push:
    branches:
      - refactor/world-clock-authority

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare scoped patcher
        run: node scripts/prepare-world-clock-patcher.mjs

      - name: Apply deterministic time authority patch
        run: node scripts/apply-world-clock-authority.mjs

      - name: Apply world clock follow-up fixes
        run: node scripts/fix-world-clock-followups.mjs

      - name: Syntax check
        run: npm run check

      - name: Tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-clock-test-output
          path: test-output.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core.js index.js manifest.json package.json world-clock-authority.js
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat(time): make world clock authoritative"
          git push
