name: Secret Presence Probe

on:
  push:
    branches:
      - experiment/real-rp-youzi-probe-v1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_YOUZI: ${{ secrets.YOUZI }}
      CANDIDATE_YOUZI_API_KEY: ${{ secrets.YOUZI_API_KEY }}
      CANDIDATE_TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
      CANDIDATE_CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
      CANDIDATE_API_KEY: ${{ secrets.API_KEY }}
      CANDIDATE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CANDIDATE_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            CANDIDATE_YOUZI \
            CANDIDATE_YOUZI_API_KEY \
            CANDIDATE_TEST_API_KEY \
            CANDIDATE_CUSTOM_API_KEY \
            CANDIDATE_API_KEY \
            CANDIDATE_OPENAI_API_KEY \
            CANDIDATE_DEEPSEEK_API_KEY
          do
            if [ -n "${!name:-}" ]; then
              printf '%s=present\n' "$name"
            else
              printf '%s=missing\n' "$name"
            fi
          done
