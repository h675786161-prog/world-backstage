name: Fix manual event status

on:
  push:
    branches:
      - fix/manual-event-status

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply event status fix
        run: node scripts/fix-manual-event-status.mjs
      - name: Syntax check
        run: npm run check
      - name: Event status regression gate
        run: node --test tests/manual-event-status.test.mjs
      - name: Full regression suite
        run: npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core.js index.js ui.js
          git commit -m "fix(events): allow manual terminal correction without resurrection"
          git push
