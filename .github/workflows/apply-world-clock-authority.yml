name: Apply world clock authority refactor

on:
  push:
    branches:
      - refactor/world-clock-authority

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect world clock refactor state
        id: refactor-state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const core = fs.readFileSync('core.js', 'utf8');
          const hasAuthorityImport = core.includes("from './world-clock-authority.js'");
          const hasSchema25 = core.includes('export const SCHEMA_VERSION = 25;');
          const hasSchema24 = core.includes('export const SCHEMA_VERSION = 24;');
          const hasAuthorityModule = fs.existsSync('world-clock-authority.js');

          if (hasAuthorityImport && hasSchema25 && hasAuthorityModule) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'already_applied=true\n');
              console.log('World clock authority refactor is already applied; patch generation will be skipped.');
              process.exit(0);
          }

          if (!hasAuthorityImport && hasSchema24) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'already_applied=false\n');
              console.log('World clock authority refactor is not applied yet; deterministic patch generation will run.');
              process.exit(0);
          }

          console.error('Refusing to patch a partial or inconsistent world clock refactor state.');
          console.error({ hasAuthorityImport, hasSchema25, hasSchema24, hasAuthorityModule });
          process.exit(1);
          NODE

      - name: Prepare scoped patcher
        if: steps.refactor-state.outputs.already_applied != 'true'
        run: node scripts/prepare-world-clock-patcher.mjs

      - name: Apply deterministic time authority patch
        if: steps.refactor-state.outputs.already_applied != 'true'
        run: node scripts/apply-world-clock-authority.mjs

      - name: Apply world clock follow-up fixes
        run: node scripts/fix-world-clock-followups.mjs

      - name: Syntax check
        run: npm run check

      - name: Full regression report
        continue-on-error: true
        shell: bash
        run: npm test 2>&1 | tee test-output.txt

      - name: World clock regression gate
        run: node --test tests/world-clock-authority.test.mjs tests/world-clock-core.test.mjs

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-clock-test-output
          path: test-output.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core.js index.js manifest.json package.json world-clock-authority.js tests/world-clock-authority.test.mjs tests/world-clock-core.test.mjs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(time): harden authoritative clock transitions"
          git push
