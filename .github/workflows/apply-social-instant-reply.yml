name: Apply social instant reply toggle

on:
  push:
    branches:
      - feat/social-instant-reply-toggle
    paths:
      - scripts/apply-social-instant-reply.mjs
      - tests/social-instant-reply.test.mjs
      - .github/workflows/apply-social-instant-reply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/social-instant-reply-toggle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded patch
        run: node scripts/apply-social-instant-reply.mjs
      - name: Syntax check
        run: |
          node --check index.js
          node --check ui.js
      - name: Targeted regressions
        run: |
          node --test tests/social-instant-reply.test.mjs
          node --test tests/social-memory-swipe.test.mjs
          node --test tests/communication-ecology.test.mjs
          node --test tests/core.test.mjs
      - name: Remove one-shot tooling and commit
        run: |
          rm -f scripts/apply-social-instant-reply.mjs
          rm -f .github/workflows/apply-social-instant-reply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(social): add instant reply toggle and cat delivery'
          git push origin HEAD:feat/social-instant-reply-toggle
